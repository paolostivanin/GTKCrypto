name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# GTK 4.16 and libadwaita 1.6 are required, which the Ubuntu runners do not
# ship yet, so every job runs in a Fedora container. Git is installed before
# checkout so that `meson dist` sees a real repository.
env:
  FEDORA_PACKAGES: >-
    git meson ninja-build gcc clang gettext desktop-file-utils appstream gnupg2
    gtk4-devel libadwaita-devel libgcrypt-devel gpgme-devel

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Install dependencies
        run: dnf install -y $FEDORA_PACKAGES
      - uses: actions/checkout@v4
      - name: Configure
        run: meson setup build --buildtype=release -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Install smoke test
        run: DESTDIR="$PWD/stage" meson install -C build
      - name: Distribution archive
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson dist -C build --no-tests

  sanitizers:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - name: Install dependencies
        run: dnf install -y $FEDORA_PACKAGES libasan libubsan compiler-rt
      - uses: actions/checkout@v4
      - run: meson setup build -Db_sanitize=address,undefined -Db_lundef=false
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs

  fuzz-smoke:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      CC: clang
    steps:
      - name: Install dependencies
        run: dnf install -y $FEDORA_PACKAGES compiler-rt
      - uses: actions/checkout@v4
      - run: meson setup build -Dfuzzing=true -Db_lundef=false
      - run: meson compile -C build fuzz-v3-text fuzz-decrypt-file
      - name: Fuzz (seed corpus is copied so the checkout stays clean)
        run: |
          for target in fuzz-v3-text fuzz-decrypt-file; do
            cp -r tests/corpus "corpus-$target"
            ASAN_OPTIONS=detect_leaks=0 ./build/tests/$target "corpus-$target" -max_total_time=20
          done

  static-analysis:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      CC: clang
    steps:
      - name: Install dependencies
        run: dnf install -y $FEDORA_PACKAGES clang-analyzer perl
      - uses: actions/checkout@v4
      - run: meson setup build
      - name: scan-build (fails when it reports a bug)
        run: ninja -C build scan-build

  gui-smoke:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: dnf install -y $FEDORA_PACKAGES xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon
      - uses: actions/checkout@v4
      - run: meson setup build
      - run: meson compile -C build
      - name: GUI starts and stays up
        run: |
          set +e
          GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a timeout 8 ./build/src/gtkcrypto
          rc=$?
          # 124 = still running when timeout stopped it; anything else is a crash or early exit
          test "$rc" -eq 124
